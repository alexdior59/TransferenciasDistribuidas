<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias Interbancarias SAGA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Transferencias SAGA</h1>
    <div class="card">
        <form id="transferForm">
            <div class="form-group">
                <label for="cuentaOrigen">Cuenta Origen (Banco Nacional - PostgreSQL):</label>
                <select id="cuentaOrigen" required>
                    <option value="">Seleccione cuenta origen...</option>
                    <option value="BN-001">BN-001 (Juan Pérez - $5000)</option>
                    <option value="BN-002">BN-002 (María García - $10000)</option>
                    <option value="BN-003">BN-003 (Carlos Rodríguez - $2500)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cuentaDestino">Cuenta Destino (Banco Internacional - MySQL):</label>
                <select id="cuentaDestino" required>
                    <option value="">Seleccione cuenta destino...</option>
                    <option value="BI-001">BI-001 (Laura Sánchez - $8000)</option>
                    <option value="BI-002">BI-002 (Pedro López - $3000)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="monto">Monto a Transferir ($):</label>
                <input type="number" id="monto" min="1" step="0.01" required>
            </div>

            <button type="submit" id="btnTransferir">Ejecutar Transferencia SAGA</button>
        </form>
        <div id="mensajeResult" class="hidden"></div>
    </div>

    <div class="card">
        <h2>Historial de Transacciones</h2>
        <ul id="historialList"></ul>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
